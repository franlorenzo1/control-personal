<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guardá tus contraseñas de forma local y segura en tu navegador." />
  <meta name="theme-color" content="#243b53" />
  <title>Control Personal - Contraseñas</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <h1>Panel de Control Personal</h1>
        <p>Vista: Contraseñas</p>
      </div>
    </div>
    <nav class="main-nav">
      <a href="./finanzas.html">💸 Finanzas</a>
      <a href="./notas.html">📝 Notas</a>
      <a href="./contrasenas.html" class="active">🔐 Contraseñas</a>
    </nav>
    <div class="data-btns">
      <button class="data-btn export-btn">⬇️ Exportar datos</button>
      <button class="data-btn import-btn">⬆️ Importar datos</button>
    </div>
  </header>

  <input type="file" id="import-file" accept=".json" style="display:none" />

  <main class="layout single-column">
    <section class="card">
      <h2>🔐 Contraseñas (local)</h2>
      <p class="warning">Esto se guarda en tu navegador. Para producción deberías cifrar los datos y usar backend
        seguro.</p>
      <form id="password-form" class="inline-form">
        <label for="password-service">Servicio</label>
        <input id="password-service" type="text" required placeholder="Ej: Gmail" />
        <label for="password-user">Usuario</label>
        <input id="password-user" type="text" required placeholder="Ej: tu@email.com" />
        <label for="password-secret">Contraseña</label>
        <div class="password-field-wrap">
          <input id="password-secret" type="password" required placeholder="Tu contraseña..." />
          <button type="button" id="password-secret-toggle" class="toggle-secret"
            title="Mostrar/ocultar contraseña">👁</button>
        </div>
        <button type="submit">Guardar acceso</button>
      </form>
      <div class="search-wrap">
        <input id="passwords-search" class="search-input" type="search"
          placeholder="🔍 Buscar por servicio o usuario..." />
      </div>
      <ul id="passwords-list" class="list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
